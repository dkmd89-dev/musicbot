# mapping/podcast_rss_feeds.yaml
# ─────────────────────────────────────────────────────────────────────────────
# RSS-Feeds für Spotify-Podcasts
#
# Diese Datei mappt Spotify-Show-IDs auf öffentliche RSS-Feeds.
# Wenn eine Show hier konfiguriert ist, wird der Bot den RSS-Feed
# für den Download nutzen (KEIN Premium erforderlich!).
#
# Format:
#   spotify_show_id:
#     name: "Anzeigename des Podcasts"
#     rss_feed: "https://url.zum/rss/feed.xml"
#     enabled: true
#     priority: 1
#     source: "audiorella|podbean|apple|etc"
# ─────────────────────────────────────────────────────────────────────────────

